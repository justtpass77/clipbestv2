services:
  - type: web
    name: clipbest-studio
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: GUMROAD_CREATOR_PRO_URL
        value: https://webox.gumroad.com/l/creatorpro
      - key: GUMROAD_PRO_PERMALINK
        value: creatorpro
